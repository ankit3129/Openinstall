name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build and attach to its GitHub Release (leave blank for a test build)"
        required: false
        type: string
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: openinstall-windows-build
  cancel-in-progress: false

# Read-only by default; only the publish job below gets write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Verify release tag matches package.json version
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION. Bump package.json and publish a matching release."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies with npm 10
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npx --yes npm@10 ci
          else
            echo "::warning::package-lock.json is not committed, so dependency versions are not pinned. Run 'npm install' locally and commit the lockfile."
            npx --yes npm@10 install
          fi
      - name: Check JavaScript syntax, validate catalog, run tests
        run: npx --yes npm@10 run check
      - name: Build Windows setup
        run: npx --yes npm@10 run dist:win
      - name: Upload installer and updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: OpenInstall-Windows-Setup
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: OpenInstall-Windows-Setup
          path: release
      - name: Publish installer and updater metadata
        # Consider pinning this to a commit SHA, since this job can write to the repository.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
