name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build and attach to its GitHub Release (leave blank for a test build)"
        required: false
        type: string
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: openinstall-windows-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Verify release tag matches package.json version
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION. Bump package.json and publish a matching release."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies with npm 10
        run: npx --yes npm@10 install
      - name: Check JavaScript syntax and validate catalog
        run: npx --yes npm@10 run check
      - name: Build Windows setup
        run: npx --yes npm@10 run dist:win
      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenInstall-Windows-Setup
          path: release/*.exe
          if-no-files-found: error
      - name: Publish installer and updater metadata
        if: (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
