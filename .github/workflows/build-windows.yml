name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build and attach to its GitHub Release (leave blank for a test build)"
        required: false
        type: string
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: openinstall-windows-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies with npm 10
        run: npx --yes npm@10 install
      - name: Check JavaScript syntax
        run: npx --yes npm@10 run check
      - name: Build Windows setup
        run: npx --yes npm@10 run dist:win
      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenInstall-Windows-Setup
          path: release/*.exe
          if-no-files-found: error
      - name: Publish installer to GitHub Release
        if: startsWith(inputs.release_tag || github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            release/*.exe
            release/*.yml
